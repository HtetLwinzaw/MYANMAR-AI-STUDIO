<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Myanmar AI Studio</title>
  <style>
    body {
      font-family: sans-serif;
      max-width: 640px;
      margin: 24px auto;
      padding: 0 16px 40px;
      background: #111;
      color: #eee;
    }
    h1 {
      font-size: 22px;
      margin-bottom: 6px;
    }
    .sub {
      color: #bbb;
      font-size: 14px;
      margin-top: 0;
    }
    textarea, select, button {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      font-size: 15px;
      border-radius: 8px;
      border: 1px solid #444;
      background: #222;
      color: #eee;
      box-sizing: border-box;
    }
    .ai-info {
      margin-top: 8px;
      padding: 10px 12px;
      border-radius: 8px;
      background: #191922;
      border: 1px solid #2e2e3d;
      font-size: 13px;
      color: #cbd5e1;
      line-height: 1.5;
    }
    .option-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 10px;
      font-size: 13.5px;
      color: #ddd;
    }
    .option-row input {
      width: auto;
      margin: 0;
    }
    button {
      background: #4f46e5;
      border: none;
      font-weight: bold;
      cursor: pointer;
    }
    button:hover:not(:disabled) {
      background: #4338ca;
    }
    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    #result {
      margin-top: 16px;
      padding: 12px;
      border-radius: 8px;
      background: #1a1a1f;
      border: 1px solid #2e2e38;
      min-height: 48px;
    }
    #result img {
      width: 100%;
      border-radius: 8px;
      display: block;
    }
    .status-note {
      font-size: 13px;
      color: #93c5fd;
      margin-bottom: 8px;
    }
    .err {
      color: #ff8080;
      line-height: 1.5;
    }
    .download-btn {
      background: #15803d;
      margin-top: 10px;
    }
    .download-btn:hover {
      background: #166534;
    }
  </style>
</head>
<body>
  <h1>Myanmar AI Studio</h1>
  <p class="sub">AI ၁ ခုလျှင် ၁၀ ပုံ/နေ့  AI ၅ ခု စုစုပေါင်း ၅၀ ပုံ/နေ့ (ကြိုက်တဲ့ပုံစံ ထုတ်နိုင်  Auto-Switch မလုပ်ပါ  Watermark မပါ)</p>

  <select id="provider" onchange="updateAiInfo()">
    <option value="studio-engine-01">AI 1 - Studio Engine 01 (10 ပုံ/နေ့  All Styles)</option>
    <option value="studio-engine-02">AI 2 - Studio Engine 02 (10 ပုံ/နေ့  All Styles)</option>
    <option value="studio-engine-03">AI 3 - Studio Engine 03 (10 ပုံ/နေ့  All Styles)</option>
    <option value="studio-engine-04">AI 4 - Studio Engine 04 (10 ပုံ/နေ့  All Styles)</option>
    <option value="studio-engine-05">AI 5 - Studio Engine 05 (10 ပုံ/နေ့  All Styles)</option>
  </select>

  <div id="aiInfo" class="ai-info"></div>

  <textarea id="prompt" rows="4" placeholder="ထုတ်ချင်တဲ့ ပုံအကြောင်းကို English လို တိတိကျကျ ရေးပါ..."></textarea>

  <label class="option-row">
    <input type="checkbox" id="precisionBoost" checked />
    <span>Prompt အတိုင်း ပိုတိကျပြီး အရည်အသွေးမြင့်အောင် Precision Detail ပေါင်းထည့်မည်</span>
  </label>

  <button id="btn" onclick="generate()">ထုတ်မယ်</button>

  <div id="result">ရလဒ် ဒီမှာ ပေါ်မယ်</div>

  <script>
    const DAILY_LIMIT_PER_AI = 10;

    const AI_NAMES = {
      "studio-engine-01": "AI 1 - Studio Engine 01",
      "studio-engine-02": "AI 2 - Studio Engine 02",
      "studio-engine-03": "AI 3 - Studio Engine 03",
      "studio-engine-04": "AI 4 - Studio Engine 04",
      "studio-engine-05": "AI 5 - Studio Engine 05"
    };

    function getTodayKey() {
      const now = new Date();
      const y = now.getFullYear();
      const m = String(now.getMonth() + 1).padStart(2, "0");
      const d = String(now.getDate()).padStart(2, "0");
      return `myanmar_ai_usage_v2_${y}-${m}-${d}`;
    }

    function getUsageMap() {
      try {
        return JSON.parse(localStorage.getItem(getTodayKey()) || "{}");
      } catch (_) {
        return {};
      }
    }

    function incrementUsage(provider) {
      const map = getUsageMap();
      map[provider] = (map[provider] || 0) + 1;
      localStorage.setItem(getTodayKey(), JSON.stringify(map));
      return map[provider];
    }

    function getRemaining(provider) {
      const used = getUsageMap()[provider] || 0;
      return Math.max(0, DAILY_LIMIT_PER_AI - used);
    }

    function getTotalRemaining() {
      return Object.keys(AI_NAMES).reduce((sum, key) => sum + getRemaining(key), 0);
    }

    function updateAiInfo() {
      const provider = document.getElementById("provider").value;
      const used = getUsageMap()[provider] || 0;
      const left = Math.max(0, DAILY_LIMIT_PER_AI - used);
      const totalLeft = getTotalRemaining();
      const name = AI_NAMES[provider] || provider;

      document.getElementById("aiInfo").innerHTML =
        `<b>${name}:</b> ကြိုက်တဲ့ပုံစံ အားလုံးထုတ်နိုင် | <b>ကျန်ရှိပုံ:</b> ${left} / ${DAILY_LIMIT_PER_AI} ပုံ (သုံးပြီး: ${used} ပုံ)<br>` +
        `<b>AI ၅ ခု စုစုပေါင်းကျန်ရှိပုံ:</b> ${totalLeft} / 50 ပုံ`;
    }

    function buildFinalPrompt(rawPrompt, usePrecision) {
      if (!usePrecision) return rawPrompt;
      const lower = rawPrompt.toLowerCase();
      if (lower.includes("accurate composition") || lower.includes("no watermark")) {
        return rawPrompt;
      }
      return `${rawPrompt}. Accurate composition matching the prompt, natural lighting and textures, sharp details, no watermark, no text overlay.`;
    }

    function isLimitError(resStatus, data) {
      if (resStatus === 429) return true;
      const errMsg = `${data && data.error ? data.error : ""} ${data && data.message ? data.message : ""}`.toUpperCase();
      return (
        errMsg.includes("LIMIT") ||
        errMsg.includes("QUOTA") ||
        errMsg.includes("RATE") ||
        errMsg.includes("429")
      );
    }

    function renderDownloadButton(imageSrc) {
      const a = document.createElement("a");
      a.href = imageSrc;
      a.download = `myanmar-ai-studio-${Date.now()}.png`;
      a.style.textDecoration = "none";

      const dlBtn = document.createElement("button");
      dlBtn.type = "button";
      dlBtn.className = "download-btn";
      dlBtn.textContent = "ပုံ Download ဆွဲမယ်";
      a.appendChild(dlBtn);
      return a;
    }

    async function generate() {
      const promptEl = document.getElementById("prompt");
      const providerEl = document.getElementById("provider");
      const precisionEl = document.getElementById("precisionBoost");
      const result = document.getElementById("result");
      const btn = document.getElementById("btn");

      const rawPrompt = promptEl.value.trim();
      const provider = providerEl.value;
      const providerLabel = providerEl.options[providerEl.selectedIndex].text;

      if (!rawPrompt) {
        result.innerHTML = '<span class="err">ပုံထုတ်ရန် prompt စာအရင်ရေးပါ</span>';
        return;
      }

      if (getRemaining(provider) <= 0) {
        result.innerHTML = `<span class="err"><b>${providerLabel}</b> ရဲ့ ယနေ့ ၁၀ ပုံ limit ပြည့်သွားပါပြီ။ အပေါ်က dropdown မှာ တခြား AI တစ်ခုကို ကိုယ်တိုင်ပြောင်းရွေးပြီး ထပ်ထုတ်ပါ။</span>`;
        updateAiInfo();
        return;
      }

      const finalPrompt = buildFinalPrompt(rawPrompt, precisionEl.checked);

      btn.disabled = true;
      result.innerHTML = `<div class="status-note">အသုံးပြုနေသော AI: <b>${providerLabel}</b></div>ပုံထုတ်နေပါတယ်၊ ခဏစောင့်ပါ...`;

      try {
        const res = await fetch("/api/image", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ prompt: finalPrompt, provider })
        });

        let data = {};
        try {
          data = await res.json();
        } catch (_) {
          data = { error: "INVALID_RESPONSE" };
        }

        if (isLimitError(res.status, data)) {
          result.innerHTML = `<span class="err"><b>${providerLabel}</b> ရဲ့ limit ပြည့်သွားပါပြီ။ အပေါ်က dropdown မှာ တခြား AI တစ်ခုကို ကိုယ်တိုင်ပြောင်းရွေးပြီး ထပ်ထုတ်ကြည့်ပါ။</span>`;
          btn.disabled = false;
          updateAiInfo();
          return;
        }

        if (!res.ok || data.error || !data.image) {
          result.innerHTML = `<span class="err">ပုံထုတ်မအောင်မြင်ပါ: ${data.error || `HTTP ${res.status}`}</span>`;
          btn.disabled = false;
          return;
        }

        const usedNow = incrementUsage(provider);
        updateAiInfo();

        result.innerHTML = "";
        const note = document.createElement("div");
        note.className = "status-note";
        note.textContent = `ထုတ်ပြီးသွားသော AI: ${providerLabel} (${usedNow}/${DAILY_LIMIT_PER_AI} ပုံ)`;

        const img = document.createElement("img");
        img.src = data.image;
        img.alt = rawPrompt;

        result.appendChild(note);
        result.appendChild(img);
        result.appendChild(renderDownloadButton(data.image));
      } catch (e) {
        result.innerHTML = '<span class="err">ချိတ်ဆက်မှု မအောင်မြင်ပါ</span>';
      }

      btn.disabled = false;
    }

    updateAiInfo();
  </script>
</body>
</html>
